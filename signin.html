<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigin Form</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Momo+Signature&family=Momo+Trust+Display&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+NZ+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&family=Stack+Sans+Notch:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdn.naturettl.com/wp-content/uploads/2020/02/10184405/How-to-Photograph-Mountains-5-800x533.jpg">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="img-container">
                <img src="https://cdn.naturettl.com/wp-content/uploads/2020/02/10184405/How-to-Photograph-Mountains-5-800x533.jpg" alt="montain img">
            </div>
            <form action="#" method="post" class="form signin-form">
                <h2>SIGN <span class="highlight">IN</span></h2>
                <div class="form__field">
                    <label for="username">Username:</label>
                    <input id="username" name="username" type="text" placeholder="Username" required></input>
                </div>
                <div class="form__field">
                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" placeholder="example@gmail.com" required></input>
                </div>
                <div class="form__field">
                    <label for="password">Password:</label>
                    <input id="password" name="password" type="password" placeholder="Password" required></input>
             </div class="form__field">
                <butto class="button" type="submit">Signin</butto>
                <div class="signin">
                    Have account? <a href="index.html">Login here</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
